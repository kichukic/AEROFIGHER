name: iOS Free Sideload Build (AltStore / SideStore)

# Builds AeroFighter for iOS on a GitHub-hosted macOS runner with NO paid Apple
# Developer Program membership, and publishes the IPA to GitHub Releases.
#
# Outputs per release:
#   AeroFighter.ipa / AeroFighter-<ver>.ipa
#       Ad-hoc (pseudo) signed. AltStore / SideStore / Sideloadly re-sign it on
#       install with the user's own free Apple ID. This is the IPA the
#       altstore-source.json points at. Always produced.
#   AeroFighter-<ver>-dev-signed.ipa
#       Signed with a free Personal Team development certificate + 7-day
#       provisioning profile. Only produced when the optional secrets below are
#       set (see IOS_BUILD_GUIDE.md, "Optional: Personal Team signing").
#
# Optional repository secrets (all three needed for dev-signed IPA):
#   IOS_DEV_P12_BASE64        base64 of the exported "Apple Development" cert (.p12)
#   IOS_DEV_P12_PASSWORD      password of that .p12
#   IOS_DEV_PROFILE_BASE64    base64 of the Personal Team .mobileprovision
#
# No Ad Hoc distribution, no itms-services OTA, no App Store Connect API key.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.6). Leave empty to use version from app.json'
        required: false
        default: ''
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Publish as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA for Free Sideloading
    # macos-14 images were retired on 2026-11-02. Expo SDK 58 needs Xcode 26.4+,
    # which only the macOS 26 image ships.
    runs-on: macos-26
    timeout-minutes: 90

    env:
      MIN_XCODE: '26.4'

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Expo SDK 58 minimum is Node 22.13
          node-version: 22
          cache: 'npm'

      - name: 3. Select Xcode (>= 26.4)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          XCODE_APP=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          XV=$(xcodebuild -version | awk '/^Xcode/{print $2}')
          if [ "$(printf '%s\n%s\n' "$MIN_XCODE" "$XV" | sort -V | head -1)" != "$MIN_XCODE" ]; then
            echo "::error::Xcode $XV is older than $MIN_XCODE required by Expo SDK 58"
            exit 1
          fi

      - name: 4. Extract App Metadata
        id: meta
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          BUNDLE_ID=$(node -p "require('./app.json').expo.ios?.bundleIdentifier || 'com.aerofighter.game'")
          APP_NAME=$(node -p "require('./app.json').expo.name || 'AeroFighter'")

          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${APP_VERSION}"
          fi

          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bundle_id=${BUNDLE_ID}" >> "$GITHUB_OUTPUT"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "==> Target App: ${APP_NAME} (${BUNDLE_ID}) v${APP_VERSION} (Tag: ${TAG})"

      - name: 5. Install npm dependencies
        run: npm ci

      - name: 6. Expo Prebuild for iOS
        run: |
          # Continuous Native Generation: ios/ is generated, never committed.
          # Android is untouched (--platform ios only).
          npx expo prebuild --platform ios --clean --no-install

      - name: 7. Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            ~/Library/Caches/CocoaPods
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 8. Install CocoaPods dependencies
        run: cd ios && pod install --repo-update

      - name: 9. Build iOS Release (unsigned)
        env:
          SCHEME: ${{ steps.meta.outputs.app_name }}
        run: |
          set -o pipefail
          mkdir -p build/DerivedData
          xcodebuild -workspace "ios/${SCHEME}.xcworkspace" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build/xcodebuild.log | grep -E '^(\*\*|error:|warning: .*deprecated)' || true
          test "${PIPESTATUS[0]}" = "0" || { tail -200 build/xcodebuild.log; exit 1; }

      - name: 10. Package AltStore / SideStore IPA (ad-hoc pseudo-signed)
        env:
          SCHEME: ${{ steps.meta.outputs.app_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          APP_DIR="build/DerivedData/Build/Products/Release-iphoneos/${SCHEME}.app"
          [ -d "$APP_DIR" ] || { echo "::error::Built .app not found at $APP_DIR"; exit 1; }

          # Entitlements generated by prebuild from app.json (may be empty).
          ENT="ios/${SCHEME}/${SCHEME}.entitlements"
          if [ ! -f "$ENT" ]; then
            ENT="build/empty.entitlements"
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict/></plist>\n' > "$ENT"
          fi

          rm -rf build/ipa-altstore && mkdir -p build/ipa-altstore/Payload
          cp -R "$APP_DIR" build/ipa-altstore/Payload/
          APP="build/ipa-altstore/Payload/${SCHEME}.app"

          # Ad-hoc signature ("-") embeds entitlements so AltStore/SideStore know
          # what the app asks for; they replace this signature with the user's
          # free Apple ID signature on install.
          ./scripts/ios-sign-app.sh "$APP" "-" "$ENT"

          mkdir -p release-assets
          (cd build/ipa-altstore && zip -qry "../../release-assets/${SCHEME}-${VERSION}.ipa" Payload)
          cp "release-assets/${SCHEME}-${VERSION}.ipa" "release-assets/${SCHEME}.ipa"

          IPA="release-assets/${SCHEME}-${VERSION}.ipa"
          echo "ipa_size=$(stat -f%z "$IPA")" >> "$GITHUB_ENV"
          echo "ipa_sha=$(shasum -a 256 "$IPA" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "altstore_app=$APP" >> "$GITHUB_ENV"
          echo "==> Packaged $IPA"

      - name: 11. Optional — Personal Team development-signed IPA
        id: devsign
        env:
          SCHEME: ${{ steps.meta.outputs.app_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          P12_B64: ${{ secrets.IOS_DEV_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DEV_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_DEV_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${P12_B64}" ] || [ -z "${PROFILE_B64}" ]; then
            echo "::notice::IOS_DEV_P12_BASE64 / IOS_DEV_PROFILE_BASE64 not set — skipping Personal Team signing. The ad-hoc IPA is fine for AltStore/SideStore."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WORK="$RUNNER_TEMP/devsign"; mkdir -p "$WORK"
          echo "$P12_B64" | base64 --decode > "$WORK/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$WORK/profile.mobileprovision"
          security cms -D -i "$WORK/profile.mobileprovision" > "$WORK/profile.plist"

          # Expiry check: free Personal Team profiles last 7 days.
          EXP=$(/usr/libexec/PlistBuddy -c "Print :ExpirationDate" "$WORK/profile.plist")
          EXP_TS=$(date -j -f "%a %b %d %T %Z %Y" "$EXP" +%s 2>/dev/null || echo 0)
          NOW_TS=$(date +%s)
          if [ "$EXP_TS" -le "$NOW_TS" ]; then
            echo "::warning::Provisioning profile expired on $EXP — refresh IOS_DEV_PROFILE_BASE64. Skipping dev-signed IPA."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "==> Profile valid until $EXP ($(( (EXP_TS-NOW_TS)/3600 )) h left)"

          # Temporary keychain holding the free "Apple Development" identity.
          KC="$RUNNER_TEMP/devsign.keychain-db"; KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$WORK/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Apple Development/{print $2; exit}')
          [ -n "$IDENTITY" ] || { echo "::error::No 'Apple Development' identity in the .p12"; exit 1; }
          echo "==> Signing identity: $IDENTITY"

          # Entitlements come from the profile itself (exactly what Apple granted
          # the free team), so codesign never asks for something not provisioned.
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$WORK/profile.plist" > "$WORK/ent.plist"
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$WORK/profile.plist")
          PROFILE_BUNDLE="${APPID#*.}"   # strip TEAMID.

          rm -rf build/ipa-dev && mkdir -p build/ipa-dev/Payload
          cp -R "build/DerivedData/Build/Products/Release-iphoneos/${SCHEME}.app" build/ipa-dev/Payload/
          APP="build/ipa-dev/Payload/${SCHEME}.app"
          cp "$WORK/profile.mobileprovision" "$APP/embedded.mobileprovision"

          # Free teams cannot use wildcard App IDs; if the profile was created for
          # a different (unique) bundle ID, adopt it so the signature is valid.
          if [ "$PROFILE_BUNDLE" != "*" ]; then
            CUR=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
            if [ "$CUR" != "$PROFILE_BUNDLE" ]; then
              echo "::notice::Rewriting CFBundleIdentifier $CUR -> $PROFILE_BUNDLE to match the Personal Team profile"
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $PROFILE_BUNDLE" "$APP/Info.plist"
            fi
          fi

          ./scripts/ios-sign-app.sh "$APP" "$IDENTITY" "$WORK/ent.plist" "$KC"
          codesign --verify --deep --strict --verbose=2 "$APP"

          OUT="release-assets/${SCHEME}-${VERSION}-dev-signed.ipa"
          (cd build/ipa-dev && zip -qry "../../$OUT" Payload)
          DEVICES=$(/usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$WORK/profile.plist" 2>/dev/null | grep -c -E '^\s+[0-9A-Fa-f-]{20,}' || true)
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "expires=$EXP" >> "$GITHUB_OUTPUT"
          echo "devices=$DEVICES" >> "$GITHUB_OUTPUT"
          echo "==> Packaged $OUT (valid on $DEVICES registered device(s) until $EXP)"

          security delete-keychain "$KC" || true
          rm -rf "$WORK"

      - name: 12. Generate AltStore / SideStore source + release notes
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
          APP_NAME: ${{ steps.meta.outputs.app_name }}
          DEV_SIGNED: ${{ steps.devsign.outputs.signed }}
          DEV_EXPIRES: ${{ steps.devsign.outputs.expires }}
        run: |
          set -euo pipefail
          # Pre-existing repo copy lets the generator keep older versions listed.
          ./scripts/generate-altstore-source.sh \
            --repo "$REPO" --tag "$TAG" --version "$VERSION" \
            --bundle-id "$BUNDLE_ID" --app-name "$APP_NAME" \
            --size "$ipa_size" --app "$altstore_app" \
            --previous altstore-source.json \
            --out release-assets/altstore-source.json

          SIZE_MB=$(( ipa_size / 1024 / 1024 ))
          DEV_LINE=""
          if [ "${DEV_SIGNED}" = "true" ]; then
            DEV_LINE="- \`${APP_NAME}-${VERSION}-dev-signed.ipa\` — signed with a free Personal Team profile, installs only on the profile's registered devices, **expires ${DEV_EXPIRES}**."
          fi

          cat > release-assets/RELEASE_NOTES.md <<MD
          # ${APP_NAME} ${VERSION}

          Free iOS sideload build (AltStore / SideStore / Sideloadly). No paid Apple Developer account used.

          ### Files
          - \`${APP_NAME}.ipa\` — for AltStore / SideStore / Sideloadly (they sign it with *your* free Apple ID on install).
          ${DEV_LINE}

          ### Install with AltStore / SideStore
          Add this source: \`https://raw.githubusercontent.com/${REPO}/master/altstore-source.json\`
          — or download \`${APP_NAME}.ipa\` and open it in AltStore/SideStore (My Apps → +).

          ### Free Apple ID limits (set by Apple)
          - Apps must be refreshed every 7 days (AltStore/SideStore do this automatically).
          - Max 3 sideloaded apps at a time, 10 new App IDs per 7 days.
          - iOS 16+: enable Settings → Privacy & Security → Developer Mode.

          ### Verification
          - Bundle ID: \`${BUNDLE_ID}\`
          - Size: ${SIZE_MB} MB (${ipa_size} bytes)
          - SHA-256 (${APP_NAME}-${VERSION}.ipa): \`${ipa_sha}\`
          MD

      - name: 13. Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          APP_NAME: ${{ steps.meta.outputs.app_name }}
          DRAFT: ${{ github.event.inputs.draft || 'false' }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail
          ASSETS=("release-assets/${APP_NAME}-${VERSION}.ipa" "release-assets/${APP_NAME}.ipa" "release-assets/altstore-source.json")
          DEV="release-assets/${APP_NAME}-${VERSION}-dev-signed.ipa"
          [ -f "$DEV" ] && ASSETS+=("$DEV")

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (e.g. created by scripts/publish.sh with the
            # Android APK) — only add/replace the iOS assets, keep the APK.
            echo "==> Release $TAG exists. Uploading iOS assets..."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            FLAGS=()
            [ "$DRAFT" = "true" ] && FLAGS+=("--draft")
            [ "$PRERELEASE" = "true" ] && FLAGS+=("--prerelease")
            echo "==> Creating new release $TAG..."
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "${APP_NAME} ${VERSION}" \
              --notes-file release-assets/RELEASE_NOTES.md \
              "${FLAGS[@]}"
          fi

      - name: 14. Update altstore-source.json on master
        if: github.event.inputs.draft != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tag builds run on a detached HEAD; commit on top of the latest master.
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B master origin/master
            cp release-assets/altstore-source.json altstore-source.json
            git add altstore-source.json
            git diff --cached --quiet && { echo "Source unchanged"; exit 0; }
            git commit -m "chore(altstore): update source for ${{ steps.meta.outputs.version }}"
            git push origin master && exit 0
            echo "Push rejected (attempt $attempt), retrying..."; sleep 5
          done
          echo "::warning::Could not push altstore-source.json; the copy attached to the release is still valid."

      - name: 15. Upload Workflow Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sideload-${{ steps.meta.outputs.version }}
          path: |
            release-assets/*.ipa
            release-assets/altstore-source.json
            release-assets/RELEASE_NOTES.md
            build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
